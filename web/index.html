<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>模型指纹检测 · Sub2API</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <div class="brand">
          <span class="mark" aria-hidden="true"><i></i></span>
          <h1>模型指纹检测</h1>
          <span class="brand-sub">Sub2API / ModelTrace</span>
        </div>
        <div class="bar-meta">
          <button type="button" class="quiet btn-sm" id="reconnect" hidden>
            重新连接
          </button>
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="切换主题"
            aria-pressed="false"
            title="切换浅色 / 深色模式"
          >
            <svg
              class="theme-icon icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg
              class="theme-icon icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
            <span class="theme-label">浅色</span>
          </button>
          <a
            class="version"
            id="version"
            href="https://github.com/AuroraWhisperer/sub2-fingerprint/releases"
            target="_blank"
            rel="noreferrer noopener"
            hidden
            >版本发布</a
          >
        </div>
      </div>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section
        id="updatePanel"
        class="update-bar"
        aria-labelledby="updateTitle"
        hidden
      >
        <div class="update-info">
          <span id="updateTitle" class="update-badge">代码同步</span>
          <span id="updateVersions" class="update-ver"></span>
          <span id="updateStatus" class="update-msg" role="status" aria-live="polite"></span>
          <span id="updateUnsupported" class="update-hint" hidden>
            需在服务器再次执行 <code>sudo sh /opt/sub2-fingerprint/update.sh</code> 以启用页面更新
          </span>
          <span id="updateRestartHint" class="update-hint" hidden>
            更新将重启服务并重连，本次检测结果会清空
          </span>
        </div>
        <div class="update-actions">
          <button type="button" class="quiet btn-sm" id="checkUpdate">
            检查更新
          </button>
          <button type="button" class="primary btn-sm" id="installUpdate" hidden>
            一键同步更新
          </button>
        </div>
      </section>
      <noscript>请启用 JavaScript 以使用检测页面和本地评分。</noscript>
      <section
        id="auth"
        class="panel narrow"
        aria-labelledby="authTitle"
        hidden
      >
        <h2 id="authTitle">请先登录 Sub2API</h2>
        <p class="muted" id="authHint">
          登录 Sub2API 管理后台后返回此页，页面会自动连接。
        </p>
        <a class="primary auth-link" href="../admin/">打开管理后台</a>
      </section>
      <section id="desk" class="desk" hidden>
        <div class="panel config">
          <div class="panel-title">
            <h2>检测配置</h2>
            <span class="footnote" id="estimate" aria-live="polite"></span>
          </div>
          <form id="runForm">
            <fieldset>
              <div class="field-head">
                <span class="field-title">账号</span>
                <div class="field-actions">
                  <span id="accountInfo" class="footnote">读取中…</span>
                  <button type="button" class="link" id="selectAllAccounts">
                    全选
                  </button>
                  <button type="button" class="link" id="refreshAccounts">
                    刷新
                  </button>
                </div>
              </div>
              <div id="accounts" class="choices"></div>
            </fieldset>
            <fieldset>
              <div class="field-head">
                <span class="field-title">挑战题</span>
                <div class="field-actions">
                  <button type="button" class="link" id="selectAllQuestions">
                    全选
                  </button>
                </div>
              </div>
              <div class="q-grid" id="questions"></div>
            </fieldset>
            <div class="action">
              <button
                type="submit"
                class="primary"
                id="start"
                aria-describedby="estimate"
                disabled
              >
                开始检测
              </button>
            </div>
          </form>
          <div class="verify" id="verify" hidden>
            <div class="verify-title">二次验证</div>
            <form id="stepForm" class="inline">
              <label class="field"
                >管理员验证码<input
                  type="text"
                  inputmode="numeric"
                  name="code"
                  pattern="[0-9]{6}"
                  required
                  maxlength="6"
                  placeholder="6 位数字"
                  autocomplete="one-time-code" /></label
              ><button class="quiet" type="submit">验证</button>
            </form>
          </div>
        </div>
        <section class="panel results" aria-labelledby="resultTitle">
          <div class="panel-title">
            <h2 id="resultTitle">检测结果</h2>
            <div class="field-actions">
              <button class="quiet btn-sm" id="cancel" type="button" hidden>
                取消剩余请求
              </button>
              <button type="button" id="reloadResults" class="link">
                刷新
              </button>
            </div>
          </div>
          <div id="runProgress" class="run-progress" aria-live="polite" hidden>
            <div class="progress-meta">
              <span id="progressLabel">准备检测</span>
              <span id="progressDetail">0 / 0</span>
            </div>
            <div
              id="progressBar"
              class="progress-track"
              role="progressbar"
              aria-label="检测进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span></span>
            </div>
          </div>
          <div id="bankStatus" class="footnote" aria-live="polite" hidden>
            <span id="bankMessage"></span>
            <button type="button" id="retryBank" class="link" hidden>
              重试
            </button>
          </div>
          <div id="result" aria-busy="false">
            <p class="empty">选择账号和挑战题后开始检测。</p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
